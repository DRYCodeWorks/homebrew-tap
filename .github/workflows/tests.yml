name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      # PR-only by necessity: test-bot picks formulae by diffing HEAD against
      # origin/main, which is empty on a push to main. Formula changes must
      # therefore land via PR to get built and tested — see README.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      # test-bot has no cask equivalent — `--only-formulae` reports
      # `testing_formulae (none)` for a cask-only change, and the tap-syntax
      # step above covers style and audit but never installs anything. So a
      # wrong sha256, an unreachable url, or an `app` stanza naming a bundle
      # that is not in the archive all pass CI and fail for every user.
      # Install what changed, then uninstall it.
      - name: Install and uninstall changed casks
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: |
          tap="$(brew --repo drycodeworks/tap)"
          git -C "$tap" fetch -q origin "${{ github.base_ref }}"
          changed="$(git -C "$tap" diff --name-only \
            "origin/${{ github.base_ref }}...HEAD" -- Casks || true)"
          if [[ -z "$changed" ]]; then
            echo "No cask changes in this PR."
            exit 0
          fi
          while read -r path; do
            [[ -n "$path" ]] || continue
            cask="$(basename "$path" .rb)"

            # Respect `depends_on arch:`. The matrix runs both Intel and Apple
            # Silicon, and a cask that legitimately declares one of them is not
            # a failure on the other — brew would refuse the install and the
            # step would report a defect that does not exist.
            # Homebrew normalises the token: `depends_on arch: :arm64` comes
            # back as "arm", not "arm64", and :x86_64 as "intel". Comparing
            # against uname -m directly never matches.
            case "$(uname -m)" in
              arm64) here=arm ;;
              *)     here=intel ;;
            esac
            # One line on purpose: a multi-line python heredoc inside a YAML
            # block scalar has to be indented to stay in the block, and python
            # then rejects the uniform leading whitespace.
            want="$(brew info --json=v2 --cask "drycodeworks/tap/$cask" 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin)['casks'][0]; a=(d.get('depends_on') or {}).get('arch') or []; print(','.join(x.get('type','') if isinstance(x,dict) else str(x) for x in a))" 2>/dev/null || true)"
            if [[ -n "$want" && ",$want," != *",$here,"* ]]; then
              echo "==> $cask requires arch [$want]; this runner is $here. Skipping."
              continue
            fi

            echo "==> Installing drycodeworks/tap/$cask"
            # Snapshot first so we can exec ONLY what this cask added. A runner
            # image ships its own apps, and some of them never exit on --help:
            # "Google Chrome for Testing" hangs, which made a first version of
            # this check fail every cask PR and blame the cask.
            before="$(find /Applications -maxdepth 1 -name '*.app' | sort)"
            brew install --cask "drycodeworks/tap/$cask"
            after="$(find /Applications -maxdepth 1 -name '*.app' | sort)"
            installed="$(comm -13 <(echo "$before") <(echo "$after"))"

            # Installing is not evidence the thing runs. DRYCodeWorks/tacet#25
            # shipped a cask that installed perfectly, passed every check
            # above, and then hung in _dyld_start on first exec — casks
            # quarantine by default, and nothing ever launches these bundles
            # through LaunchServices, so the consent gate had nobody to answer
            # it. Green CI, broken for every user.
            #
            # So exec what we installed. --help is the cheapest proof a bundle
            # reaches its own main(): a quarantine wedge blocks in the dynamic
            # loader and never gets there. Bounded, because that failure mode
            # is a hang rather than a crash — unbounded, it would burn the job
            # timeout instead of naming the problem.
            if [[ -z "$installed" ]]; then
              echo "==> $cask added no .app to /Applications; nothing to exec."
            fi
            while read -r app; do
              [[ -n "$app" && -d "$app" ]] || continue
              exe_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
                "$app/Contents/Info.plist" 2>/dev/null)" || continue
              exe="$app/Contents/MacOS/$exe_name"
              [[ -x "$exe" ]] || continue
              echo "==> Executing $exe --help"
              # Background-and-poll rather than timeout(1): a stock macOS
              # runner has neither timeout nor gtimeout, so depending on
              # coreutils would leave this silently unbounded on exactly the
              # platform it protects. Same reasoning as run_bounded() in
              # tacet's install-server.sh.
              rc=0
              "$exe" --help >/dev/null 2>&1 &
              pid=$!
              waited=0
              while kill -0 "$pid" 2>/dev/null; do
                if (( waited >= 30 )); then
                  kill -9 "$pid" 2>/dev/null || true
                  wait "$pid" 2>/dev/null || true
                  rc=124
                  break
                fi
                sleep 1
                waited=$((waited + 1))
              done
              [[ $rc -eq 124 ]] || { wait "$pid"; rc=$?; }
              [[ $rc -eq 0 ]] && continue
              if [[ $rc -eq 124 ]]; then
                echo "::error::$cask: $app hangs on exec (rc=124) — likely a quarantine wedge, see DRYCodeWorks/tacet#25"
              else
                echo "::error::$cask: $app exited $rc on --help"
              fi
              exit 1
            done <<< "$installed"

            brew uninstall --cask "drycodeworks/tap/$cask"
          done <<< "$changed"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
